<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园二手交易平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
        campus: { green: '#10b981', orange: '#f59e0b', red: '#ef4444', pink: '#ec4899', purple: '#8b5cf6', teal: '#14b8a6' }
      }
    }
  }
}
</script>
<style>
* { -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f1f5f9; min-height: 100vh; }
.slide-up { animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
.modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
.category-card:active { transform: scale(0.97); }
.toast { animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.5s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }
input[type="file"] { display: none; }
.image-preview { object-fit: cover; border-radius: 0.5rem; }
.chat-bubble-mine { background: #3b82f6; color: #fff; border-radius: 1rem 1rem 0.25rem 1rem; }
.chat-bubble-other { background: #f1f5f9; color: #1e293b; border-radius: 1rem 1rem 1rem 0.25rem; }
.star-rating input[type="radio"] { display: none; }
.star-rating label { cursor: pointer; transition: transform 0.15s; }
.star-rating label:hover { transform: scale(1.2); }
.special-zone-card { position: relative; overflow: hidden; }
.special-zone-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.08; border-radius: inherit; }
.zone-graduation::before { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
.zone-exam::before { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
.zone-dorm::before { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.pickup-code { font-family: 'Courier New', monospace; letter-spacing: 0.3em; }
.credit-bar { transition: width 0.5s ease; }
.boosted-card { box-shadow: 0 0 0 2px rgba(245,158,11,0.4), 0 4px 12px rgba(245,158,11,0.15); }
.boosted-badge { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; animation: boostPulse 2s infinite; }
@keyframes boostPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); } 50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); } }
.ad-carousel { scroll-snap-type: x mandatory; }
.ad-carousel > * { scroll-snap-align: center; flex-shrink: 0; }
.consignment-card { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%); }
.glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.barter-rental-preview { transition: all 0.3s ease; }
.barter-rental-preview:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
@media (min-width: 768px) { .md-grid-3 { grid-template-columns: repeat(3, 1fr); } .md-px-8 { padding-left: 2rem; padding-right: 2rem; } .md-max-w-2xl { max-width: 42rem; } .md-flex-row { flex-direction: row; } .md-w-1-2 { width: 50%; } .md-text-base { font-size: 1rem; } .md-p-6 { padding: 1.5rem; } .md-rounded-2xl { border-radius: 1rem; } .md-hidden { display: none; } .md-block { display: block; } .md-inline { display: inline; } .md-flex { display: flex; } }
@media (min-width: 1024px) {
  .lg-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .lg-grid-5 { grid-template-columns: repeat(5, 1fr); }
  .lg-max-w-4xl { max-width: 56rem; }
  .lg-max-w-6xl { max-width: 72rem; }
  .lg-container { max-width: 1200px; margin: 0 auto; }
  .lg-px-8 { padding-left: 2rem; padding-right: 2rem; }
  .lg-hidden { display: none !important; }
  .lg-block { display: block !important; }
  .lg-flex { display: flex !important; }
  .lg-grid { display: grid !important; }
  .lg-sidebar { display: flex !important; }
  .lg-main-layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }
  .lg-content-area { padding-left: 2rem; padding-right: 2rem; }
  .lg-detail-layout { display: grid; grid-template-columns: 420px 1fr; gap: 2rem; align-items: start; }
  .lg-detail-image { max-height: 420px; border-radius: 1rem; }
  .lg-chat-modal { width: 480px; height: 560px; border-radius: 1rem; right: 2rem; bottom: 5rem; left: auto; top: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .lg-modal-dialog { max-width: 480px; }
  .lg-text-lg { font-size: 1.125rem; }
  .lg-text-xl { font-size: 1.25rem; }
  .lg-text-2xl { font-size: 1.5rem; }
  .lg-text-3xl { font-size: 1.875rem; }
  .lg-w-80 { width: 20rem; }
  .lg-p-6 { padding: 1.5rem; }
  .lg-p-8 { padding: 2rem; }
  .lg-gap-4 { gap: 1rem; }
  .lg-gap-6 { gap: 1.5rem; }
  .lg-rounded-2xl { border-radius: 1rem; }
  .lg-shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); }
  .lg-sticky { position: sticky; top: 72px; }
  .lg-overflow-visible { overflow: visible; }
  .lg-bottom-nav { display: none !important; }
  .lg-top-nav-enhanced { padding: 0.75rem 2rem; }
  .lg-card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
  .lg-card-hover { transition: all 0.2s ease; }
  .lg-auth-center { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 50%, #f5f3ff 100%); }
  .lg-auth-card { width: 420px; background: #fff; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); padding: 2.5rem; }
  .lg-order-table { display: table; width: 100%; }
  .lg-order-table-row { display: table-row; }
  .lg-order-table-cell { display: table-cell; padding: 0.75rem 1rem; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
  .lg-stats-grid { grid-template-columns: repeat(4, 1fr); }
  .lg-banner-height { min-height: 120px; }
  .lg-max-w-3xl { max-width: 48rem; }
  .lg-max-w-5xl { max-width: 64rem; }
  .lg-w-1-2 { width: 50%; }
  .lg-w-1-3 { width: 33.333%; }
  .lg-w-2-3 { width: 66.666%; }
  .lg-mx-auto { margin-left: auto; margin-right: auto; }
}
 </style>
</head>
<body class="min-h-screen">

<!-- Toast提示 -->
<div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col items-center gap-2 pointer-events-none"></div>

<!-- ==================== 登录注册页 ==================== -->
<div id="authPage" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 via-white to-indigo-50 lg-auth-center">
  <div class="w-full max-w-md lg-auth-card">


    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-500 rounded-2xl mb-4 shadow-lg shadow-primary-200">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">校园二手交易</h1>
      <p class="text-gray-500 text-sm mt-1">闲置物品，校内流转</p>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm" class="bg-white rounded-2xl shadow-sm p-6 slide-up">
      <h2 class="text-lg font-semibold text-gray-800 mb-5 text-center">登录</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">学号</label>
          <input type="text" id="loginStudentId" placeholder="请输入学号" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all" autocomplete="off">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all" autocomplete="off">
        </div>
        <button onclick="handleLogin()" class="w-full py-3 bg-primary-500 text-white rounded-xl font-medium text-sm hover:bg-primary-600 active:bg-primary-700 transition-all shadow-sm shadow-primary-200">登录</button>
      </div>
      <p class="text-center text-sm text-gray-500 mt-4">还没有账号？<span onclick="switchAuthTab('register')" class="text-primary-500 font-medium cursor-pointer hover:underline">立即注册</span></p>
      <p class="text-center text-xs text-gray-400 mt-2">管理员测试：学号 admin / 密码 admin123</p>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" class="bg-white rounded-2xl shadow-sm p-6 slide-up hidden">
      <h2 class="text-lg font-semibold text-gray-800 mb-5 text-center">注册</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">学号 <span class="text-red-400">*</span></label>
          <input type="text" id="regStudentId" placeholder="请输入学号（6-12位数字）" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">用户名 <span class="text-red-400">*</span></label>
          <input type="text" id="regUsername" placeholder="请输入用户名" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">密码 <span class="text-red-400">*</span></label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">确认密码 <span class="text-red-400">*</span></label>
          <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">所在校区</label>
          <select id="regCampus" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all bg-white">
            <option value="">请选择校区</option>
            <option value="主校区">主校区</option>
            <option value="东校区">东校区</option>
            <option value="西校区">西校区</option>
            <option value="南校区">南校区</option>
            <option value="北校区">北校区</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">手机号</label>
          <input type="tel" id="regPhone" placeholder="请输入手机号" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all">
        </div>
        <button onclick="handleRegister()" class="w-full py-3 bg-primary-500 text-white rounded-xl font-medium text-sm hover:bg-primary-600 active:bg-primary-700 transition-all shadow-sm shadow-primary-200">注册</button>
      </div>
      <p class="text-center text-sm text-gray-500 mt-4">已有账号？<span onclick="switchAuthTab('login')" class="text-primary-500 font-medium cursor-pointer hover:underline">去登录</span></p>
    </div>
  </div>
</div>

<!-- ==================== 举报/投诉模态框 ==================== -->
<div id="reportModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl fade-in">
    <h3 class="text-lg font-bold text-gray-800 text-center mb-1">提交举报/投诉</h3>
    <p id="reportTitle" class="text-xs text-gray-500 text-center mb-4"></p>
    <div class="mb-3">
      <label class="block text-xs font-medium text-gray-600 mb-1.5">类型</label>
      <select id="reportType" class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 bg-white">
        <option value="product_fake">商品信息不实</option>
        <option value="product_banned">违禁品</option>
        <option value="product_price">价格欺诈</option>
        <option value="user_fraud">卖家诈骗</option>
        <option value="user_harass">骚扰行为</option>
        <option value="other">其他违规</option>
      </select>
    </div>
    <textarea id="reportDesc" rows="3" placeholder="请详细描述违规情况..." class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 resize-none mb-4"></textarea>
    <div class="flex gap-3">
      <button onclick="closeReportModal()" class="flex-1 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors">取消</button>
      <button onclick="submitReport()" class="flex-1 py-2.5 bg-campus-red text-white rounded-xl text-sm font-medium hover:bg-red-600 transition-colors">提交举报</button>
    </div>
  </div>
</div>

<!-- ==================== 主应用页面 ==================== -->
<div id="mainApp" class="hidden min-h-screen flex flex-col">

  <!-- 桌面端侧边栏 -->
  <aside id="desktopSidebar" class="hidden lg-sidebar flex-col w-[220px] bg-white border-r border-gray-100 fixed left-0 top-0 bottom-0 z-20 pt-16 pb-4 overflow-y-auto shadow-sm">
    <div class="px-4 space-y-0.5">
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">主导航</div>
      <button onclick="switchUserTabDesktop('home')" data-dtab="home" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-primary-500 bg-primary-50 font-medium transition-colors hover:bg-primary-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>首页
      </button>
      <button onclick="switchUserTabDesktop('publish')" data-dtab="publish" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>发布商品
      </button>
      <button onclick="switchUserTabDesktop('orders')" data-dtab="orders" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>我的订单
      </button>
      <button onclick="switchUserTabDesktop('zones')" data-dtab="zones" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>特色专区
      </button>
      <button onclick="switchUserTabDesktop('profile')" data-dtab="profile" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>个人中心
      </button>
      <div id="desktopAdminSection" class="hidden">
        <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-4 px-2">管理后台</div>
        <button onclick="switchAdminTabDesktop('review')" data-dtab="review" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>审核
        </button>
        <button onclick="switchAdminTabDesktop('products')" data-dtab="products" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>商品管理
        </button>
        <button onclick="switchAdminTabDesktop('users')" data-dtab="users" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>用户管理
        </button>
        <button onclick="switchAdminTabDesktop('dashboard')" data-dtab="dashboard" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>数据看板
        </button>
        <button onclick="switchAdminTabDesktop('reports')" data-dtab="reports" class="dnav-tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-gray-600 transition-colors hover:bg-gray-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>违规处理
        </button>
      </div>

// ==================== 工具函数 ====================
function $(id) { return document.getElementById(id); }
function showToast(msg, type) {
  type = type || 'success';
  const bg = type === 'success' ? 'bg-campus-green' : type === 'error' ? 'bg-campus-red' : 'bg-primary-500';
  const toast = document.createElement('div');
  toast.className = 'toast ' + bg + ' text-white px-5 py-2.5 rounded-xl text-sm shadow-lg max-w-xs text-center';
  toast.textContent = msg;
  $('toastContainer').appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
}

function showConfirm(msg) {
  return new Promise(function(resolve) {
    $('confirmMessage').textContent = msg;
    $('confirmDialog').classList.remove('hidden');
    $('confirmOk').onclick = function() { $('confirmDialog').classList.add('hidden'); resolve(true); };
    $('confirmCancel').onclick = function() { $('confirmDialog').classList.add('hidden'); resolve(false); };
  });
}

function guardAdmin() {
  var user = getCurrentUser();
  if (!user || user.role !== 'admin') { showToast('权限不足，仅管理员可访问', 'error'); return false; }
  return true;
}

function formatTime(isoStr) {
  var d = new Date(isoStr);
  var now = new Date();
  var diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

  var map = { textbooks: '教材', electronics: '电子产品', furniture: '家具', clothing: '服饰', daily: '日用品' };

// ==================== 认证模块 ====================
function switchAuthTab(tab) {
  if (tab === 'login') {
    $('loginForm').classList.remove('hidden');
    $('registerForm').classList.add('hidden');
  } else {
    $('loginForm').classList.add('hidden');
    $('registerForm').classList.remove('hidden');
    $('registerForm').classList.add('slide-up');
  }
}

function handleLogin() {
  var studentId = $('loginStudentId').value.trim();
  var password = $('loginPassword').value.trim();
  if (!studentId) { showToast('请输入学号', 'error'); return; }
  if (!password) { showToast('请输入密码', 'error'); return; }
  var users = getUsers();
  var user = null;
  for (var i = 0; i < users.length; i++) {
    if (users[i].studentId === studentId) { user = users[i]; break; }
  }
  if (!user) { showToast('学号不存在，请先注册', 'error'); return; }
  if (atob(user.password) !== password) { showToast('密码错误', 'error'); return; }
  setCurrentUser(user);
  showAuthSuccess();
}

function handleRegister() {
  var studentId = $('regStudentId').value.trim();
  var username = $('regUsername').value.trim();
  var password = $('regPassword').value.trim();
  var passwordConfirm = $('regPasswordConfirm').value.trim();
  var campus = $('regCampus').value;
  var phone = $('regPhone').value.trim();

  if (!studentId) { showToast('请输入学号', 'error'); return; }
  if (!/^\d{6,12}$/.test(studentId)) { showToast('学号格式不正确（6-12位数字）', 'error'); return; }
  if (!username) { showToast('请输入用户名', 'error'); return; }
  if (username.length < 2) { showToast('用户名至少2个字符', 'error'); return; }
  if (!password) { showToast('请输入密码', 'error'); return; }
  if (password.length < 6) { showToast('密码至少6位', 'error'); return; }
  if (password !== passwordConfirm) { showToast('两次密码输入不一致', 'error'); return; }
  if (!campus) { showToast('请选择所在校区', 'error'); return; }

  var users = getUsers();
  for (var i = 0; i < users.length; i++) {
    if (users[i].studentId === studentId) { showToast('该学号已注册，请直接登录', 'error'); return; }
  }

  var newUser = {
    id: 'u_' + Date.now(),
    studentId: studentId,
    username: username,
    password: btoa(password),
    campus: campus,
    phone: phone,
    role: 'student',
    creditScore: 100,
    createdAt: new Date().toISOString()
  };
  users.push(newUser);
  saveUsers(users);
  setCurrentUser(newUser);
  showToast('注册成功！', 'success');
  showAuthSuccess();
}

function showAuthSuccess() {
  $('authPage').classList.add('hidden');
  $('mainApp').classList.remove('hidden');
  var user = getCurrentUser();
  $('headerUserInfo').textContent = user.username + ' | ' + user.campus;
  if (user.role === 'admin') {
    $('adminBadge').classList.remove('hidden');
    $('adminNav').classList.remove('hidden');
    $('userNav').classList.add('hidden');
     var ads = $('desktopAdminSection');
     if (ads) ads.classList.remove('hidden');
    switchAdminTab('review');
  } else {
    $('adminBadge').classList.add('hidden');
    $('adminNav').classList.add('hidden');
    $('userNav').classList.remove('hidden');
    var adminSection = $('desktopAdminSection');
    if (adminSection) adminSection.classList.add('hidden');
    switchUserTab('home');
  }
}

function handleLogout() {
  localStorage.removeItem('campus_currentUser');
  $('authPage').classList.remove('hidden');
  $('mainApp').classList.add('hidden');
  $('loginStudentId').value = '';
  $('loginPassword').value = '';
  var ads = $('desktopAdminSection');
  if (ads) ads.classList.add('hidden');
  showToast('已退出登录');
}

}

function handleImageUpload(input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('图片大小不能超过5MB', 'error'); return; }

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 400, maxH = 400;
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        if (w > h) { h = Math.round(h * maxW / w); w = maxW; }
        else { w = Math.round(w * maxH / h); h = maxH; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      publishImageData = canvas.toDataURL('image/jpeg', 0.7);
      var preview = document.getElementById('imagePreview');
      var placeholder = document.getElementById('imagePlaceholder');
      if (preview) { preview.src = publishImageData; preview.classList.remove('hidden'); }
      if (placeholder) placeholder.classList.add('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ==================== 订单业务逻辑 ====================
async function buyProduct(productId) {
  var user = getCurrentUser();
  var product = getProducts().find(function(p) { return p.id === productId; });
  if (!product) { showToast('商品不存在', 'error'); return; }
  if (product.sellerId === user.id) { showToast('不能购买自己的商品', 'error'); return; }
  var existingOrder = getOrders().find(function(o) { return o.productId === productId && o.buyerId === user.id && o.status !== 'cancelled'; });
  if (existingOrder) { showToast('你已下单该商品，请勿重复下单', 'error'); return; }
  var confirmed = await showConfirm('确认购买「' + product.title + '」？\n价格：¥' + product.price + '\n自提地点：' + product.campus + ' · ' + product.pickupLocation);
  if (!confirmed) return;
  var newOrder = {
    id: 'o_' + Date.now(),
    productId: productId,
    buyerId: user.id,
    sellerId: product.sellerId,
    price: product.price,
    status: 'pending',
    pickupCode: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  var orders = getOrders();
  orders.unshift(newOrder);
  saveOrders(orders);
  showToast('下单成功！等待卖家确认', 'success');
  switchUserTab('orders');
}

async function confirmOrder(orderId) {
  var confirmed = await showConfirm('确认此交易？确认后买家将等待自提。');
  if (!confirmed) return;
  var orders = getOrders();
  var idx = orders.findIndex(function(o) { return o.id === orderId; });
  if (idx === -1) return;
  orders[idx].status = 'confirmed';
  orders[idx].updatedAt = new Date().toISOString();
  saveOrders(orders);
  showToast('已确认交易', 'success');
  renderOrdersPage($('mainContent'));
}

async function cancelOrder(orderId) {
  var confirmed = await showConfirm('确认取消此订单？');
  if (!confirmed) return;
  var orders = getOrders();
  var idx = orders.findIndex(function(o) { return o.id === orderId; });
  if (idx === -1) return;
  orders[idx].status = 'cancelled';
  orders[idx].updatedAt = new Date().toISOString();
  saveOrders(orders);
  showToast('订单已取消', 'success');
  renderOrdersPage($('mainContent'));
}

async function generatePickupCode(orderId) {
  var confirmed = await showConfirm('生成自提码后，买家可凭码核销。确认生成？');
  if (!confirmed) return;
  var orders = getOrders();
  var idx = orders.findIndex(function(o) { return o.id === orderId; });
  if (idx === -1) return;
  var code = Math.random().toString(36).substring(2, 8).toUpperCase();
  orders[idx].pickupCode = code;
  orders[idx].status = 'pickup_ready';
  orders[idx].updatedAt = new Date().toISOString();
  saveOrders(orders);
  showToast('自提码已生成：' + code, 'success');
  renderOrdersPage($('mainContent'));
}

async function verifyPickupCode(orderId) {
  var code = prompt('请输入自提码：');
  if (!code) return;
  var orders = getOrders();
  var idx = orders.findIndex(function(o) { return o.id === orderId; });
  if (idx === -1) return;
  if (orders[idx].pickupCode !== code.toUpperCase()) { showToast('自提码错误，请检查', 'error'); return; }
  orders[idx].status = 'completed';
  orders[idx].updatedAt = new Date().toISOString();
  saveOrders(orders);
  showToast('核销成功！交易完成，请双方互相评价', 'success');
  renderOrdersPage($('mainContent'));
}

// ==================== 聊天模块 ====================
var currentChatOrderId = null;
var currentChatOtherUserId = null;

function openChatWithSeller(productId) {
  var product = getProducts().find(function(p) { return p.id === productId; });
  if (!product) return;
  var seller = getUsers().find(function(u) { return u.id === product.sellerId; });
  currentChatOtherUserId = product.sellerId;
  currentChatOrderId = 'chat_product_' + productId;
  var chatTitle = '与 ' + (seller ? seller.username : '卖家') + ' 聊天';
  $('chatTitle').textContent = chatTitle;
  $('chatModal').classList.remove('hidden');
  if (window.innerWidth < 1024) document.body.style.overflow = 'hidden';
  renderChatMessages();
}

function openChatOrder(orderId) {
  var order = getOrders().find(function(o) { return o.id === orderId; });
  if (!order) return;
  var user = getCurrentUser();
  var otherUserId = order.buyerId === user.id ? order.sellerId : order.buyerId;
  var otherUser = getUsers().find(function(u) { return u.id === otherUserId; });
  currentChatOtherUserId = otherUserId;
  currentChatOrderId = orderId;
  var chatTitle = '与 ' + (otherUser ? otherUser.username : '对方') + ' 聊天';
  $('chatTitle').textContent = chatTitle;
  $('chatModal').classList.remove('hidden');
  if (window.innerWidth < 1024) document.body.style.overflow = 'hidden';
  renderChatMessages();
}

function closeChatModal() {
  $('chatModal').classList.add('hidden');

// ==================== 评价模块 ====================
var reviewOrderId = null;

function openReviewModal(orderId) {
  var order = getOrders().find(function(o) { return o.id === orderId; });
  if (!order) return;
  var user = getCurrentUser();
  var targetUserId = order.buyerId === user.id ? order.sellerId : order.buyerId;
  var targetUser = getUsers().find(function(u) { return u.id === targetUserId; });
  var existingReview = getReviews().find(function(r) { return r.orderId === orderId && r.reviewerId === user.id; });
  if (existingReview) { showToast('你已经评价过了', 'error'); return; }
  reviewOrderId = orderId;
  $('reviewTargetName').textContent = '评价 ' + (targetUser ? targetUser.username : '对方');
  var stars = document.getElementsByName('rating');
  for (var i = 0; i < stars.length; i++) { stars[i].checked = false; }
  $('reviewComment').value = '';
  $('reviewModal').classList.remove('hidden');
}

function closeReviewModal() {
  $('reviewModal').classList.add('hidden');
  reviewOrderId = null;
}

async function submitReview() {
  if (!reviewOrderId) return;
  var stars = document.getElementsByName('rating');
  var rating = 0;
  for (var i = 0; i < stars.length; i++) { if (stars[i].checked) { rating = parseInt(stars[i].value); break; } }
  if (rating === 0) { showToast('请选择评分', 'error'); return; }
  var comment = $('reviewComment').value.trim();
  var user = getCurrentUser();
  var order = getOrders().find(function(o) { return o.id === reviewOrderId; });
  if (!order) return;
  var targetUserId = order.buyerId === user.id ? order.sellerId : order.buyerId;

  var review = {
    id: 'r_' + Date.now(),
    orderId: reviewOrderId,
    reviewerId: user.id,
    targetUserId: targetUserId,
    rating: rating,
    comment: comment,
    createdAt: new Date().toISOString()
  };
  var reviews = getReviews();
  reviews.push(review);
  saveReviews(reviews);

  updateCreditScore(targetUserId);

  var targetReviews = reviews.filter(function(r) { return r.orderId === reviewOrderId; });
  if (targetReviews.length >= 2) {
    var orders = getOrders();
    var oi = orders.findIndex(function(o) { return o.id === reviewOrderId; });
    if (oi !== -1) { orders[oi].status = 'rated'; saveOrders(orders); }
  }

  closeReviewModal();
  showToast('评价提交成功！', 'success');
  renderOrdersPage($('mainContent'));
}

function updateCreditScore(userId) {
  var reviews = getReviews().filter(function(r) { return r.targetUserId === userId; });
  if (reviews.length === 0) return;
  var avg = reviews.reduce(function(sum, r) { return sum + r.rating; }, 0) / reviews.length;
  var score = Math.round(avg * 20);
  var users = getUsers();
  var ui = users.findIndex(function(u) { return u.id === userId; });
  if (ui !== -1) { users[ui].creditScore = score; saveUsers(users); }
}

    var count = categoryCounts[c] || 0;

  });

  if (topCategory) {
    html += '<div class="bg-gradient-to-r from-primary-50 to-blue-50 rounded-2xl p-4 shadow-sm"><p class="text-xs text-gray-500">🔥 热门分类</p><p class="text-sm font-semibold text-primary-600 mt-0.5">' + getCategoryLabel(topCategory) + ' 类商品最多（' + topCount + '件）</p></div>';

// ==================== 举报业务逻辑 ====================
var reportTargetType = null;
var reportTargetId = null;

function openReportModal(type, targetId, title) {
  reportTargetType = type;
  reportTargetId = targetId;
  var ref = $('reportType');
  if (type === 'product') {
    ref.innerHTML = '<option value="product_fake">商品信息不实</option><option value="product_banned">违禁品</option><option value="product_price">价格欺诈</option><option value="other">其他违规</option>';
  } else {
    ref.innerHTML = '<option value="user_fraud">卖家诈骗</option><option value="user_harass">骚扰行为</option><option value="other">其他违规</option>';
  }
  $('reportTitle').textContent = (type === 'product' ? '举报商品：' : '投诉用户：') + (title || '');
  $('reportDesc').value = '';
  $('reportModal').classList.remove('hidden');
}

function closeReportModal() {
  $('reportModal').classList.add('hidden');
  reportTargetType = null;
  reportTargetId = null;
}

function submitReport() {
  if (!reportTargetId) return;
  var type = $('reportType').value;
  var desc = $('reportDesc').value.trim();
  if (!desc) { showToast('请描述违规情况', 'error'); return; }
  var user = getCurrentUser();
  var report = {
    id: 'rp_' + Date.now(),
    targetType: reportTargetType,
    targetId: reportTargetId,
    type: type,
    description: desc,
    reporterId: user.id,
    status: 'pending',
    handlerNote: '',
    createdAt: new Date().toISOString()
  };
  var reports = getReports();
  reports.unshift(report);
  saveReports(reports);
  closeReportModal();
  showToast('举报已提交，管理员将尽快处理', 'success');
}

// ==================== 管理员举报处理页 ====================
function renderAdminReports(container) {
  var allReports = getReports();
  allReports.sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
  var activeFilter = container.dataset.reportFilter || 'pending';
  var filtered = allReports;
  if (activeFilter !== 'all') { filtered = allReports.filter(function(r) { return r.status === activeFilter; }); }

  var html = '<div class="p-4 fade-in"><h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><svg class="w-5 h-5 text-campus-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>违规处理</h2>';

  html += '<div class="flex gap-2 overflow-x-auto scrollbar-hide pb-2 mb-3">';
  var filters = [{ key: 'pending', label: '待处理' }, { key: 'resolved', label: '已处理' }, { key: 'dismissed', label: '已驳回' }, { key: 'all', label: '全部' }];
  filters.forEach(function(f) {
    var count = f.key === 'all' ? allReports.length : allReports.filter(function(r) { return r.status === f.key; }).length;
    var active = activeFilter === f.key ? 'bg-campus-red text-white' : 'bg-white text-gray-600 border border-gray-200';
    html += '<button onclick="setReportFilter(\'' + f.key + '\')" class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition-all ' + active + '">' + f.label + ' (' + count + ')</button>';
  });
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div class="text-center py-16"><div class="text-5xl mb-4">✅</div><p class="text-gray-400 text-sm">暂无相关举报</p></div>';
  } else {
    filtered.forEach(function(r) {
      var reporter = getUsers().find(function(u) { return u.id === r.reporterId; });
      var reporterName = reporter ? reporter.username : '匿名';
      var typeLabels = { product_fake: '商品信息不实', product_banned: '违禁品', product_price: '价格欺诈', user_fraud: '卖家诈骗', user_harass: '骚扰行为', other: '其他违规' };
      var statusBg = r.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : r.status === 'resolved' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500';

      var targetInfo = '';
      if (r.targetType === 'product') {
        var prod = getProducts().find(function(p) { return p.id === r.targetId; });
        targetInfo = '商品：' + (prod ? escHtml(prod.title) : '已删除');
      } else {
        var uTarget = getUsers().find(function(u) { return u.id === r.targetId; });
        targetInfo = '用户：' + (uTarget ? uTarget.username + '（' + uTarget.studentId + '）' : '已注销');
      }

      html += '<div class="bg-white rounded-2xl shadow-sm p-4 mb-3 fade-in">';
      html += '<div class="flex items-center justify-between mb-2"><span class="text-xs px-2 py-0.5 rounded-full ' + statusBg + '">' + (r.status === 'pending' ? '待处理' : r.status === 'resolved' ? '已处理' : '已驳回') + '</span><span class="text-xs text-gray-400">' + formatTime(r.createdAt) + '</span></div>';
      html += '<p class="text-xs text-gray-500 mb-1"><span class="font-medium">类型：</span>' + (typeLabels[r.type] || r.type) + '</p>';
      html += '<p class="text-xs text-gray-500 mb-1"><span class="font-medium">对象：</span>' + targetInfo + '</p>';
      html += '<p class="text-xs text-gray-500 mb-1"><span class="font-medium">举报人：</span>' + reporterName + '</p>';
      html += '<div class="bg-gray-50 rounded-lg p-2.5 mb-3"><p class="text-xs text-gray-600">' + escHtml(r.description) + '</p></div>';
      if (r.handlerNote) { html += '<div class="bg-blue-50 rounded-lg p-2.5 mb-3"><p class="text-xs text-blue-700">处理备注：' + escHtml(r.handlerNote) + '</p></div>'; }

      if (r.status === 'pending') {
        html += '<div class="flex gap-2 flex-wrap">';
        html += '<button onclick="resolveReport(\'' + r.id + '\')" class="text-xs py-1.5 px-3 bg-campus-green text-white rounded-lg hover:bg-green-600 transition-colors">标记已处理</button>';
        html += '<button onclick="dismissReport(\'' + r.id + '\')" class="text-xs py-1.5 px-3 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300 transition-colors">驳回举报</button>';
        if (r.targetType === 'product') {
          html += '<button onclick="banProductByReport(\'' + r.targetId + '\')" class="text-xs py-1.5 px-3 bg-campus-red text-white rounded-lg hover:bg-red-600 transition-colors">下架商品</button>';
        }
        html += '</div>';
      }
      html += '</div>';
    });
  }
  html += '</div>';
  container.innerHTML = html;
}

function setReportFilter(filter) {
  $('mainContent').dataset.reportFilter = filter;
  renderAdminReports($('mainContent'));
}

async function resolveReport(reportId) {
  if (!guardAdmin()) return;
  var note = prompt('处理备注（可选）：') || '';
  var reports = getReports();
  var idx = reports.findIndex(function(r) { return r.id === reportId; });
  if (idx === -1) return;
  reports[idx].status = 'resolved';
  reports[idx].handlerNote = note;
  saveReports(reports);
  showToast('已标记为已处理', 'success');
  renderAdminReports($('mainContent'));
}

async function dismissReport(reportId) {
  if (!guardAdmin()) return;
  var note = prompt('驳回理由（可选）：') || '';
  var reports = getReports();
  var idx = reports.findIndex(function(r) { return r.id === reportId; });
  if (idx === -1) return;
  reports[idx].status = 'dismissed';
  reports[idx].handlerNote = note;
  saveReports(reports);
  showToast('已驳回该举报', 'success');
  renderAdminReports($('mainContent'));
}

async function banProductByReport(productId) {
  if (!guardAdmin()) return;
  var confirmed = await showConfirm('确认下架该商品？');
  if (!confirmed) return;
  var products = getProducts();
  var idx = products.findIndex(function(p) { return p.id === productId; });
  if (idx === -1) return;
  products[idx].status = 'removed';
  saveProducts(products);
  showToast('商品已下架', 'success');
}

    { icon: '📍', title: '校内自提', desc: '所有交易必须在校内公共场所完成交接（如图书馆、食堂、教学楼大厅等）。禁止校外私下交易。' },
    { icon: '👥', title: '当面验收', desc: '建议当面验收商品成色与描述是否一致，确认无误后再完成交易。保留聊天记录作为凭证。' },
    { icon: '🔒', title: '安全交易', desc: '不要提前转账或支付定金！建议使用校园一卡通或当面扫码支付。谨防电信网络诈骗。' },
    { icon: '⭐', title: '诚信评价', desc: '交易完成后请及时互相评价。信用分将影响商品展示和交易权限。低信用分用户将被限制使用。' },
    { icon: '🚫', title: '违规处理', desc: '发布违禁品、虚假信息、骚扰他人等违规行为将被下架商品、限制账号，严重者永久封禁。' },
    { icon: '📢', title: '举报机制', desc: '发现违规商品或不良行为，请点击商品详情页的"举报"按钮或联系管理员。我们将24小时内处理。' },
    { icon: '🔧', title: '纠纷处理', desc: '交易纠纷可联系管理员介入处理。平台保留最终裁定权，将依据聊天记录、商品信息等证据做出公平判定。' }
  ];

  rules.forEach(function(r, i) {
    html += '<div class="bg-white rounded-2xl p-4 mb-2 shadow-sm"><div class="flex items-start gap-3"><span class="text-xl flex-shrink-0">' + r.icon + '</span><div><h3 class="text-sm font-semibold text-gray-800 mb-1">' + (i + 1) + '. ' + r.title + '</h3><p class="text-xs text-gray-500 leading-relaxed">' + r.desc + '</p></div></div></div>';
  });

  html += '<div class="mt-4 bg-blue-50 rounded-2xl p-4"><p class="text-xs text-blue-700 leading-relaxed">📧 如有疑问或需要帮助，请联系管理员（学号: admin）。平台将持续完善规则，营造良好的校园二手交易环境。</p></div>';
  html += '</div>';

// ==================== 平台公告页 ====================
function renderAnnouncementsPage(container) {
  var announcements = getAnnouncements().sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
  var html = '<div class="p-4 fade-in"><h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><svg class="w-5 h-5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>平台公告</h2>';

  var user = getCurrentUser();
  if (user && user.role === 'admin') {
    html += '<div class="bg-white rounded-2xl p-4 mb-3 shadow-sm"><h3 class="text-sm font-semibold text-gray-700 mb-3">发布新公告</h3><input type="text" id="newAnnTitle" placeholder="公告标题" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 mb-2"><textarea id="newAnnContent" rows="3" placeholder="公告内容..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 resize-none mb-2"></textarea><div class="flex gap-2"><select id="newAnnType" class="px-3 py-2 border border-gray-200 rounded-xl text-xs"><option value="info">普通公告</option><option value="warning">重要提醒</option><option value="danger">紧急通知</option></select><button onclick="publishAnnouncement()" class="flex-1 py-2 bg-campus-orange text-white rounded-xl text-sm font-medium hover:bg-orange-600 transition-colors">发布公告</button></div></div>';
  }

  if (announcements.length === 0) {
    html += '<div class="text-center py-16"><div class="text-5xl mb-4">📭</div><p class="text-gray-400 text-sm">暂无公告</p></div>';
  } else {
    announcements.forEach(function(a) {
      var borderColor = a.type === 'warning' ? 'border-l-campus-orange' : a.type === 'danger' ? 'border-l-campus-red' : 'border-l-primary-500';
      html += '<div class="bg-white rounded-2xl p-4 mb-2 shadow-sm border-l-4 ' + borderColor + '">';
      html += '<div class="flex items-center justify-between mb-1"><h3 class="text-sm font-semibold text-gray-800">' + escHtml(a.title) + '</h3>' + (user && user.role === 'admin' ? '<button onclick="deleteAnnouncement(\'' + a.id + '\')" class="text-xs text-red-400 hover:text-red-600">删除</button>' : '') + '</div>';
      html += '<p class="text-xs text-gray-500 leading-relaxed">' + escHtml(a.content) + '</p>';
      html += '<p class="text-[10px] text-gray-300 mt-2">' + formatTime(a.createdAt) + '</p>';
      html += '</div>';
    });
  }
  html += '</div>';
  container.innerHTML = html;
}

async function publishAnnouncement() {
  if (!guardAdmin()) return;
  var title = ($('newAnnTitle') && $('newAnnTitle').value || '').trim();
  var content = ($('newAnnContent') && $('newAnnContent').value || '').trim();
  var type = $('newAnnType') && $('newAnnType').value || 'info';
  if (!title) { showToast('请输入公告标题', 'error'); return; }
  if (!content) { showToast('请输入公告内容', 'error'); return; }
  var list = getAnnouncements();
  list.unshift({ id: 'a_' + Date.now(), title: title, content: content, type: type, createdAt: new Date().toISOString() });
  saveAnnouncements(list);
  showToast('公告已发布', 'success');
  renderAnnouncementsPage($('mainContent'));
}

async function deleteAnnouncement(id) {
  if (!guardAdmin()) return;
  var confirmed = await showConfirm('确认删除此公告？');
  if (!confirmed) return;
  var list = getAnnouncements().filter(function(a) { return a.id !== id; });
  saveAnnouncements(list);
  showToast('公告已删除', 'success');
  renderAnnouncementsPage($('mainContent'));
}

// ==================== 图片模态框 ====================
function openImageModal(src) {
  $('imageModalImg').src = src;
  $('imageModal').classList.remove('hidden');
}
function closeImageModal() {
  $('imageModal').classList.add('hidden');
}

// ==================== HTML转义 ====================
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escJs(str) {
  if (!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
}

// ==================== 初始化 ====================
initData();

// 检查是否已登录
var savedUser = getCurrentUser();
if (savedUser) {
  // 验证用户是否仍然存在
  var users = getUsers();
  var found = users.find(function(u) { return u.id === savedUser.id; });
  if (found) {
    setCurrentUser(found);
    $('authPage').classList.add('hidden');
    $('mainApp').classList.remove('hidden');
    $('headerUserInfo').textContent = found.username + ' | ' + found.campus;
    if (found.role === 'admin') {
      $('adminBadge').classList.remove('hidden');
      $('adminNav').classList.remove('hidden');
      $('userNav').classList.add('hidden');
      switchAdminTab('review');
    } else {
      switchUserTab('home');
    }
  } else {
    localStorage.removeItem('campus_currentUser');
  }
}

// Enter键登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!$('authPage').classList.contains('hidden')) {
      if (!$('loginForm').classList.contains('hidden')) handleLogin();
      else if (!$('registerForm').classList.contains('hidden')) handleRegister();
    }
  }
});
</script>
