<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择你的宠物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #FF6B9D;
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.3);
        }

        .subtitle {
            color: #FF9F43;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .pet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .pet-card {
            background: linear-gradient(135deg, #fff5f5 0%, #fff0f5 100%);
            border: 3px solid transparent;
            border-radius: 25px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .pet-card:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.3);
            border-color: #FF6B9D;
        }

        .pet-emoji {
            font-size: 48px;
            transition: transform 0.3s ease;
        }

        .pet-card:hover .pet-emoji {
            animation: bounce 0.5s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .pet-name {
            font-size: 1.1em;
            color: #555;
            font-weight: bold;
        }

        .pet-desc {
            font-size: 0.85em;
            color: #888;
            margin-top: -5px;
        }

        .confirm-btn {
            background: linear-gradient(135deg, #FF6B9D, #C44569);
            border: none;
            border-radius: 25px;
            padding: 18px 50px;
            font-family: 'Comic Sans MS', cursive;
            font-size: 1.3em;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        }

        .confirm-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 107, 157, 0.5);
        }

        .confirm-btn:active {
            transform: translateY(-1px);
        }

        .confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .selected-indicator {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            background: #FF6B9D;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            box-shadow: 0 2px 10px rgba(255, 107, 157, 0.5);
        }

        .pet-card.selected {
            border-color: #FF6B9D;
            background: linear-gradient(135deg, #ffe0e0 0%, #ffd6e0 100%);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .pet-card.selected .pet-emoji {
            animation: wiggle 0.5s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .sparkles-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .sparkle {
            position: absolute;
            font-size: 20px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .pet-emoji {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="sparkles-bg" id="sparklesBg"></div>

    <div class="container">
        <h1>🐾 选择你的宠物 🐾</h1>
        <p class="subtitle">选择一只可爱的小伙伴开始冒险吧！</p>

        <div class="pet-grid">
            <div class="pet-card" data-pet="cat">
                <span class="pet-emoji">🐱</span>
                <span class="pet-name">猫咪</span>
                <span class="pet-desc">傲娇可爱</span>
            </div>
            <div class="pet-card" data-pet="dog">
                <span class="pet-emoji">🐶</span>
                <span class="pet-name">狗狗</span>
                <span class="pet-desc">忠诚活泼</span>
            </div>
            <div class="pet-card" data-pet="rabbit">
                <span class="pet-emoji">🐰</span>
                <span class="pet-name">兔子</span>
                <span class="pet-desc">软萌可爱</span>
            </div>
            <div class="pet-card" data-pet="hamster">
                <span class="pet-emoji">🐹</span>
                <span class="pet-name">仓鼠</span>
                <span class="pet-desc">圆滚滚</span>
            </div>
            <div class="pet-card" data-pet="bird">
                <span class="pet-emoji">🐦</span>
                <span class="pet-name">小鸟</span>
                <span class="pet-desc">歌声悦耳</span>
            </div>
            <div class="pet-card" data-pet="panda">
                <span class="pet-emoji">🐼</span>
                <span class="pet-name">熊猫</span>
                <span class="pet-desc">国宝萌物</span>
            </div>
        </div>

        <button class="confirm-btn" id="confirmBtn" disabled>
            🎉 开始养宠
        </button>
    </div>

    <script>
        const pets = {
            cat: { emoji: '🐱', name: '猫咪', desc: '傲娇可爱' },
            dog: { emoji: '🐶', name: '狗狗', desc: '忠诚活泼' },
            rabbit: { emoji: '🐰', name: '兔子', desc: '软萌可爱' },
            hamster: { emoji: '🐹', name: '仓鼠', desc: '圆滚滚' },
            bird: { emoji: '🐦', name: '小鸟', desc: '歌声悦耳' },
            panda: { emoji: '🐼', name: '熊猫', desc: '国宝萌物' }
        };

        let selectedPet = null;
        const petCards = document.querySelectorAll('.pet-card');
        const confirmBtn = document.getElementById('confirmBtn');

        const createSparkles = () => {
            const bg = document.getElementById('sparklesBg');
            const sparkleCount = 15;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle';
                sparkle.textContent = ['✨', '🌟', '💫', '⭐'][Math.floor(Math.random() * 4)];
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.animationDelay = `${Math.random() * 4}s`;
                sparkle.style.animationDuration = `${3 + Math.random() * 3}s`;
                bg.appendChild(sparkle);
            }
        };

        petCards.forEach(card => {
            card.addEventListener('click', () => {
                const petType = card.dataset.pet;
                
                if (selectedPet === petType) {
                    card.classList.remove('selected');
                    selectedPet = null;
                } else {
                    petCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedPet = petType;
                }
                
                confirmBtn.disabled = !selectedPet;
            });
        });

        confirmBtn.addEventListener('click', () => {
            if (selectedPet) {
                window.location.href = `pet.html?pet=${selectedPet}`;
            }
        });

        createSparkles();
    </script>
</body>
</html>
